<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首頁｜OMNIPLAY 客服系統</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260731-topnav1" />
  <link rel="manifest" href="/OMNIPLAY-CSR-Support/manifest.json" />
  <meta name="theme-color" content="#3B82F6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <style>
    .dashboard-todo-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .dashboard-todo-title-row h2 {
      margin: 0;
    }
    .todo-category-filter {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .todo-category-btn {
      appearance: none;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #334155;
      padding: 5px 12px;
      font: inherit;
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .todo-category-btn:hover {
      border-color: #3b82f6;
      color: #2563eb;
    }
    .todo-category-btn.active {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }
    @media (max-width: 720px) {
      .dashboard-todo-title-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <section class="login-view" id="loginView" aria-label="登入畫面">
    <form class="login-card" id="loginForm">
      <div class="login-brand">
        <span class="logo-mark">OP</span>
        <div>
          <h1>OMNIPLAY 客服系統</h1>
          <p>請登入以進入主控台</p>
        </div>
      </div>
      <label>
        <span>帳號</span>
        <input id="account" name="account" type="text" autocomplete="off" inputmode="latin" pattern="[A-Za-z0-9]*" autocapitalize="none" spellcheck="false" lang="en" placeholder="請輸入帳號（僅限英文及數字）" required />
      </label>
      <label>
        <span>密碼</span>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" inputmode="latin" pattern="[A-Za-z0-9]*" autocapitalize="none" spellcheck="false" lang="en" required />
      </label>
      <p class="form-message" id="loginMessage" hidden></p>
      <button class="primary-button" type="submit">登入</button>
    </form>
    
    <form class="login-card setup-card is-hidden" id="setupForm" aria-label="建立管理員帳號">
      <div class="login-brand">
        <span class="logo-mark">OP</span>
        <div>
          <h1>建立管理員帳號</h1>
          <p>首次設定：staff 尚無資料，請建立第一個管理員帳號。</p>
        </div>
      </div>
      <label>
        <span>人員編號</span>
        <input id="setupCode" name="code" type="text" autocomplete="off" inputmode="latin" pattern="[A-Za-z0-9]*" autocapitalize="none" spellcheck="false" lang="en" required />
      </label>
      <label>
        <span>姓名</span>
        <input id="setupName" name="name" type="text" autocomplete="name" required />
      </label>
      <label>
        <span>帳號</span>
        <input id="setupAccount" name="account" type="text" autocomplete="username" inputmode="latin" pattern="[A-Za-z0-9]*" autocapitalize="none" spellcheck="false" lang="en" required />
      </label>
      <label>
        <span>密碼</span>
        <input id="setupPassword" name="password" type="password" autocomplete="new-password" inputmode="latin" pattern="[A-Za-z0-9]*" autocapitalize="none" spellcheck="false" lang="en" required />
      </label>
      <p class="form-message" id="setupMessage" hidden></p>
      <button class="primary-button" type="submit">建立第一個帳號</button>
    </form>
  </section>

  <section class="app-shell is-hidden" aria-label="客服系統主畫面">
    <aside id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>首頁</h1>
          <p>快速查看客服支援系統入口。</p>
        </div>
        <div class="user-pill">● 已連線 Firebase</div>
      </header>
      <section class="dashboard" aria-label="首頁 dashboard">
        <div class="dashboard-stats" id="dashboardStats">
         <a class="dashboard-card today-working-card" href="service/leave.html">
            <span class="dashboard-card-label" id="todayWorkingTitle">今日上班</span>
            <div class="today-working-list" id="todayWorkingList">載入中...</div>
          </a>
          <a class="dashboard-card" href="work/handover.html">
            <span class="dashboard-card-label">待交接</span>
            <strong id="handoverFireCount">—</strong>
            <small>已標記 🔥 的交接</small>
          </a>
          <a class="dashboard-card" href="work/report.html?tracking=open&amp;build=20260718-30" onclick="sessionStorage.setItem('reportTrackingFilter','open')">
            <span class="dashboard-card-label">提報追蹤</span>
            <strong id="trackingOpenCount">—</strong>
            <small>待辦中／處理中／觀察中／追客</small>
          </a>
          <a class="dashboard-card" href="work/log.html">
            <span class="dashboard-card-label">日誌</span>
            <strong id="shiftLogCount">—</strong>
            <small>交接時段內日誌</small>
          </a>
        </div>

        <section class="dashboard-todo-card" aria-label="今日事項列表">
          <div class="panel-heading dashboard-todo-heading">
            <div>
              <div class="dashboard-todo-title-row">
                <h2>今日事項</h2>
                <div class="todo-category-filter" id="todoCategoryFilter" role="group" aria-label="今日事項分類篩選" hidden></div>
              </div>
              <p>顯示當前班次時段內更新的所有紀錄</p>
            </div>
            <div class="shift-toggle" role="group" aria-label="今日事項班次切換">
              <button class="shift-btn" id="morningShiftBtn" type="button" data-shift="morning">☀️ 早班</button>
              <button class="shift-btn" id="nightShiftBtn" type="button" data-shift="night">🌙 晚班</button>
            </div>
          </div>
          <ul class="dashboard-todo-list" id="dashboardTodoList">
            <li class="dashboard-empty">載入中...</li>
          </ul>
        </section>
      </section>
    </main>
  </section>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="assets/firebase-init.js"></script>
  <script>
    const accountInput = document.getElementById('account'); // 帳號欄位的 id

    // 處理中文輸入法的組字過程
    accountInput.addEventListener('compositionstart', function() {
      this.composing = true;
    });
    accountInput.addEventListener('compositionend', function() {
      this.composing = false;
      this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
    });
    accountInput.addEventListener('input', function() {
      if (!this.composing) {
        this.value = this.value.replace(/[^a-zA-Z0-9]/g, '');
      }
    });
  </script>
  <script src="assets/reminders.js?v=20260718-38"></script>
  <script src="assets/app.js?v=20260731-topnav1"></script>
  <script src="assets/dashboard.js?v=20260731-tracking-todo3"></script>
  <script>
    (() => {
      const list = document.getElementById('dashboardTodoList');
      const filter = document.getElementById('todoCategoryFilter');
      if (!list || !filter) return;

      const categoryOrder = ['日誌', '交接', '提報', '對接追蹤', '會議', '排程'];
      const categoryLabels = { '日誌': '日誌 NEW' };
      let selectedCategory = '全部';

      const getItemCategory = (item) => {
        const href = item.querySelector('a')?.getAttribute('href') || '';
        if (href.includes('work/log.html')) return '日誌';
        if (href.includes('work/handover.html')) return '交接';
        if (href.includes('work/report.html')) return '提報';
        if (href.includes('work/tracking.html')) return '對接追蹤';
        if (href.includes('meeting/meeting.html')) return '會議';
        if (href.includes('service/schedule.html')) return '排程';
        return '';
      };

      const applyFilter = () => {
        list.querySelectorAll(':scope > li:not(.dashboard-empty)').forEach((item) => {
          const category = getItemCategory(item);
          item.hidden = selectedCategory !== '全部' && category !== selectedCategory;
        });
      };

      const renderCategoryButtons = () => {
        const categories = new Set();
        list.querySelectorAll(':scope > li:not(.dashboard-empty)').forEach((item) => {
          const category = getItemCategory(item);
          if (category) categories.add(category);
        });

        const visibleCategories = categoryOrder.filter((category) => categories.has(category));
        if (!visibleCategories.includes(selectedCategory) && selectedCategory !== '全部') {
          selectedCategory = '全部';
        }

        if (!visibleCategories.length) {
          filter.hidden = true;
          filter.innerHTML = '';
          return;
        }

        const buttonCategories = visibleCategories.length > 1
          ? ['全部', ...visibleCategories]
          : visibleCategories;

        if (visibleCategories.length === 1 && selectedCategory === '全部') {
          selectedCategory = visibleCategories[0];
        }

        filter.innerHTML = buttonCategories.map((category) => {
          const label = categoryLabels[category] || category;
          const active = category === selectedCategory;
          return `<button class="todo-category-btn${active ? ' active' : ''}" type="button" data-category="${category}" aria-pressed="${active}">${label}</button>`;
        }).join('');
        filter.hidden = false;
        applyFilter();
      };

      filter.addEventListener('click', (event) => {
        const button = event.target.closest('.todo-category-btn');
        if (!button) return;
        selectedCategory = button.dataset.category || '全部';
        renderCategoryButtons();
      });

      const observer = new MutationObserver(renderCategoryButtons);
      observer.observe(list, { childList: true });
      renderCategoryButtons();
    })();
  </script>
</body>
</html>
